name: Build SDK release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Fresh SDK build profile (host checks only)
        type: choice
        default: 1080p60
        options: [1080p60, 1440p120, 2160p120]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_CONFIG: /usr/bin/llvm-config-21
      PSBC_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install host tools and LLVM 21
        run: |
          curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" {print $10; exit}')" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang-18 lld-18 clang-21 lld-21 llvm-21-dev cmake ninja-build pkg-config python3-venv glslang-tools spirv-tools bison flex unzip
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install meson==1.10.1 Mako==1.3.10 PyYAML==6.0.2 packaging==25.0
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Fetch checksum-pinned public payload SDK
        run: |
          curl --fail --location --retry 3 https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip -o "$RUNNER_TEMP/payload-sdk.zip"
          SDK_HASH=$(python3 -c 'import json; print(json.load(open("dependencies.json"))["native_boilerplate"]["payload_sdk_archive_sha256"])')
          printf '%s  %s\n' "$SDK_HASH" "$RUNNER_TEMP/payload-sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/payload-sdk.zip" -d "$RUNNER_TEMP/payload"
          SDK_DIR="$RUNNER_TEMP/payload/ps5-payload-sdk"
          "$SDK_DIR/bin/prospero-clang" --version
          echo "PS5_PAYLOAD_SDK=$SDK_DIR" >> "$GITHUB_ENV"
      - name: Host regressions and published evidence integrity
        run: make test
      - name: Fetch pinned graphics and example sources
        run: python3 tools/fetch-sources.py --sokol-samples
      - name: Select fresh build profile
        env:
          SDK_PROFILE: ${{ inputs.profile || '1080p60' }}
        run: |
          case "$SDK_PROFILE" in
            1080p60) HEIGHT=1080; FPS=60 ;;
            1440p120) HEIGHT=1440; FPS=120 ;;
            2160p120) HEIGHT=2160; FPS=120 ;;
            *) exit 1 ;;
          esac
          echo "SDK_PROFILE=$SDK_PROFILE" >> "$GITHUB_ENV"
          echo "PS5_SCANOUT_HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "PS5_SCANOUT_FPS=$FPS" >> "$GITHUB_ENV"
      - name: Build compiler, Mesa and PS5 static SDK
        env:
          PS5_GPU_PRESENT_BATCH: '1'
          PS5_DRAW_PROFILE: '1'
          PS5_MULTIDRAW_BATCH: '1'
          PS5_DEFERRED_DRAW_BATCH: '1'
        run: make sdk
      - name: Verify relocated SDK with three independent consumers
        run: |
          cp -a build/sdk/ps5-opengl-core33 "$RUNNER_TEMP/relocated-sdk"
          python3 tools/check-sdk-consumers.py \
            --sdk "$RUNNER_TEMP/relocated-sdk" --payload-sdk "$PS5_PAYLOAD_SDK" \
            --example-dir examples/core33-triangle \
            --registry third_party/mesa-26.2.0/src/mesa/glapi/glapi/registry/gl.xml \
            --output "$RUNNER_TEMP/consumer-checks" --forbid-root "$GITHUB_WORKSPACE"
      - name: Package SDK, source, notices and build evidence
        run: |
          VERSION="ci-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="$GITHUB_REF_NAME"; fi
          if [[ "$SDK_PROFILE" != 1080p60 ]]; then VERSION="$VERSION-$SDK_PROFILE"; fi
          python3 tools/build-sdk-bundle.py --ci-version "$VERSION" --ci-profile "$SDK_PROFILE" \
            --sdk "$RUNNER_TEMP/relocated-sdk" --source-commit "$(git rev-parse HEAD)" \
            --consumer-report "$RUNNER_TEMP/consumer-checks/summary.json" \
            --runtime-config build/core33-native-runtime/runtime-config.txt \
            --destination "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum --check ./*.tar.gz.sha256
          mkdir unpacked
          tar -xzf ./*.tar.gz -C unpacked
          cd unpacked/ps5-opengl-sdk-*
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ps5-opengl-sdk
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve consumer diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-consumer-diagnostics
          path: |
            ${{ runner.temp }}/consumer-checks/*.json
            ${{ runner.temp }}/consumer-checks/*.log
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ps5-opengl-sdk
          path: release
      - name: Create draft prerelease without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check ./*.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz ./*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "PS5 OpenGL SDK $GITHUB_REF_NAME" \
            --notes 'Experimental 1080p60 SDK, built from this tag. Includes compiled libraries, headers, source examples/dependencies, licenses, checksums and provenance. Host tests and relocated Make/pkg-config/CMake links passed. These binaries have NOT been validated on a PS5; historical CTS and performance results belong to their recorded binary identities. Review the bundled README before publishing.'
